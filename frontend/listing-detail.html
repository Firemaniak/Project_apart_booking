<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Объявление</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div style="text-align: right; padding: 0.5rem 1rem;">
        <select id="languageSelect" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <p><a href="index.html" data-i18n="back_to_catalog">← Назад к каталогу</a></p>

    <div id="listingContainer" data-i18n="loading">Загрузка...</div>

    <div id="mapContainer" style="height: 300px; margin: 1rem 0; display: none;"></div>

    <hr>

    <div id="bookingSection" style="display: none;">
        <h2 data-i18n="book_now_title">Забронировать</h2>
        <form id="bookingForm">
            <div>
                <label data-i18n="dates_label">Даты:</label>
                <input type="text" id="dateRange" placeholder="Выберите даты" readonly>
            </div>
            <div>
                <label data-i18n="guests_count_label">Количество гостей:</label>
                <input type="number" id="guestsCount" min="1" value="1" required>
            </div>
            <button type="submit" data-i18n="book_btn">Забронировать</button>
        </form>
        <p id="bookingMessage"></p>
    </div>

    <p id="loginPrompt" style="display: none;">
        <a href="login.html" data-i18n="login_link">Войдите</a>, <span data-i18n="need_login_book_suffix">чтобы забронировать это жильё.</span>
    </p>

    <hr>
    <h2 data-i18n="reviews_title">Отзывы</h2>
    <div id="reviewsContainer" data-i18n="loading">Загрузка...</div>

    <div id="reviewFormSection" style="display: none;">
        <h3 data-i18n="leave_review_title">Оставить отзыв</h3>
        <form id="reviewForm">
            <div>
                <label data-i18n="booking_label">Бронь:</label>
                <select id="reviewBookingSelect"></select>
            </div>
            <div>
                <label data-i18n="rating_label">Оценка:</label>
                <select id="reviewStars">
                    <option value="5" data-i18n="rating_5">5 - отлично</option>
                    <option value="4" data-i18n="rating_4">4 - хорошо</option>
                    <option value="3" data-i18n="rating_3">3 - нормально</option>
                    <option value="2" data-i18n="rating_2">2 - плохо</option>
                    <option value="1" data-i18n="rating_1">1 - ужасно</option>
                </select>
            </div>
            <div>
                <label data-i18n="comment_label">Комментарий:</label>
                <textarea id="reviewComment" required minlength="10"></textarea>
            </div>
            <button type="submit" data-i18n="submit_review_btn">Отправить отзыв</button>
        </form>
        <p id="reviewMessage"></p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const listingId = params.get('id');

        const listingContainer = document.getElementById('listingContainer');
        const bookingSection = document.getElementById('bookingSection');
        const loginPrompt = document.getElementById('loginPrompt');
        const bookingMessage = document.getElementById('bookingMessage');

        let calendar = null;
        let pricePerNight = 0;
        let currentUserId = null;
        let listingOwnerId = null;

        async function loadListing() {
            try {
                const listing = await apiGet(`/listings/${listingId}/`);
                renderListing(listing);
                pricePerNight = parseFloat(listing.price_per_night);
                await loadBookedDates();
                await checkOwnership(listing);
            } catch (err) {
                listingContainer.textContent = t('listing_load_error');
            }
        }

        async function checkOwnership(listing) {
            if (!isLoggedIn()) return;

            try {
                const profile = await apiGet('/users/me/');
                if (profile.id === listing.owner) {
                    bookingSection.style.display = 'none';
                    loginPrompt.style.display = 'none';

                    const ownerNotice = document.createElement('p');
                    ownerNotice.textContent = t('own_listing_notice');
                    ownerNotice.style.color = 'gray';
                    document.body.insertBefore(ownerNotice, bookingSection);
                }
            } catch (err) {
                console.error('Не удалось проверить владельца:', err);
            }
        }

        function renderListing(listing) {
            listingOwnerId = listing.owner;

            const photosHtml = (listing.photos || [])
                .map(p => `<img src="${p.image}" width="200" style="margin-right: 5px;">`)
                .join('');

            listingContainer.innerHTML = `
                <h1>${listing.apartment_name}</h1>
                <div>${photosHtml || `<p>${t('no_photos')}</p>`}</div>
                <p>${listing.country}, ${listing.address}</p>
                <p>${t('guests_up_to')} ${listing.max_guests} ${t('guests_word')}</p>
                <p><strong>${listing.price_per_night} €</strong> ${t('per_night')}</p>
                <p>${t('host_label')}: <a href="user-profile.html?id=${listing.owner}">${listing.owner_username}</a></p>
            `;

            if (listing.latitude && listing.longitude) {
                showMap(parseFloat(listing.latitude), parseFloat(listing.longitude), listing.apartment_name);
            }
        }

        function showMap(lat, lon, title) {
            const mapContainer = document.getElementById('mapContainer');
            mapContainer.style.display = 'block';

            const map = L.map('mapContainer').setView([lat, lon], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
            }).addTo(map);
            L.marker([lat, lon]).addTo(map).bindPopup(title);
        }

        async function loadBookedDates() {
            const response = await fetch(`${API_BASE_URL}/bookings/listing/${listingId}/booked-dates/`);
            const bookedRanges = await response.json();

            const disabledRanges = bookedRanges.map(r => ({ from: r.from, to: r.to }));

            calendar = flatpickr('#dateRange', {
                mode: 'range',
                minDate: 'today',
                dateFormat: 'Y-m-d',
                disable: disabledRanges,
            });
        }

        if (isLoggedIn()) {
            bookingSection.style.display = 'block';
        } else {
            loginPrompt.style.display = 'block';
        }

        document.getElementById('bookingForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            bookingMessage.textContent = '';

            const selectedDates = calendar.selectedDates;
            if (selectedDates.length < 2) {
                bookingMessage.textContent = t('select_dates_prompt');
                return;
            }

            const rawStart = selectedDates[0];
            const rawEnd = selectedDates[1];

            rawStart.setHours(15, 0, 0, 0);
            rawEnd.setHours(11, 0, 0, 0);

            const startDate = rawStart.toISOString();
            const endDate = rawEnd.toISOString();
            const guestsCount = parseInt(document.getElementById('guestsCount').value);

            try {
                const booking = await apiPost('/bookings/', {
                    listing: listingId,
                    start_date: startDate,
                    end_date: endDate,
                    guests_count: guestsCount,
                });
                bookingMessage.style.color = 'green';
                bookingMessage.textContent = t('booking_created_redirect');
                setTimeout(function () {
                    window.location.href = `booking-payment.html?booking_id=${booking.id}`;
                }, 1000);
            } catch (err) {
                bookingMessage.style.color = 'red';
                bookingMessage.textContent = JSON.stringify(err.data);
            }
        });

        async function loadReviews() {
            const container = document.getElementById('reviewsContainer');
            try {
                if (isLoggedIn()) {
                    const profile = await apiGet('/users/me/');
                    currentUserId = profile.id;
                }

                const allReviews = await apiGet('/reviews/');
                const listingReviews = [];

                for (const review of allReviews) {
                    const booking = await apiGet(`/bookings/${review.booking}/`).catch(() => null);
                    if (booking && booking.listing === listingId) {
                        listingReviews.push(review);
                    }
                }

                if (listingReviews.length === 0) {
                    container.textContent = t('no_reviews_yet');
                } else {
                    container.innerHTML = listingReviews.map(renderReview).join('');
                }
            } catch (err) {
                container.textContent = t('reviews_load_error');
            }
        }

        function renderReview(review) {
            const stars = '★'.repeat(review.stars) + '☆'.repeat(5 - review.stars);
            const isOwner = currentUserId === listingOwnerId;
            const canRespond = isOwner && !review.owner_response;

            return `
                <div style="border: 1px solid #ddd; padding: 10px; margin-bottom: 10px;">
                    <p>${stars}</p>
                    <p>${review.comment}</p>
                    ${review.owner_response
                        ? `<p style="margin-left: 20px; color: gray;"><strong>${t('owner_response_label')}:</strong> ${review.owner_response}</p>`
                        : ''
                    }
                    ${canRespond
                        ? `<div>
                             <textarea id="response-${review.id}" placeholder="${t('your_response_placeholder')}"></textarea>
                             <button type="button" onclick="submitOwnerResponse('${review.id}')">${t('respond_btn')}</button>
                           </div>`
                        : ''
                    }
                </div>
            `;
        }

        async function submitOwnerResponse(reviewId) {
            const textarea = document.getElementById(`response-${reviewId}`);
            const text = textarea.value.trim();

            if (!text) {
                alert(t('enter_response_prompt'));
                return;
            }

            try {
                await apiPatch(`/reviews/${reviewId}/response/`, { owner_response: text });
                await loadReviews();
            } catch (err) {
                alert(t('response_send_error') + ': ' + JSON.stringify(err.data));
            }
        }

        async function setupReviewForm() {
            if (!isLoggedIn()) return;
            if (currentUserId === listingOwnerId) return;

            try {
                const myBookings = await apiGet('/bookings/');
                const now = new Date();

                const eligibleBookings = myBookings.filter(function (b) {
                    return b.listing === listingId && new Date(b.end_date) < now;
                });

                if (eligibleBookings.length === 0) return;

                const select = document.getElementById('reviewBookingSelect');
                select.innerHTML = eligibleBookings.map(function (b) {
                    const start = new Date(b.start_date).toLocaleDateString();
                    const end = new Date(b.end_date).toLocaleDateString();
                    return `<option value="${b.id}">${start} — ${end}</option>`;
                }).join('');

                document.getElementById('reviewFormSection').style.display = 'block';
            } catch (err) {
                console.error('Не удалось проверить брони для отзыва:', err);
            }
        }

        document.getElementById('reviewForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const message = document.getElementById('reviewMessage');

            const payload = {
                booking: document.getElementById('reviewBookingSelect').value,
                stars: parseInt(document.getElementById('reviewStars').value),
                comment: document.getElementById('reviewComment').value,
            };

            try {
                await apiPost('/reviews/', payload);
                message.style.color = 'green';
                message.textContent = t('review_sent');
                document.getElementById('reviewForm').reset();
                await loadReviews();
            } catch (err) {
                message.style.color = 'red';
                message.textContent = JSON.stringify(err.data);
            }
        });

        async function init() {
            await loadListing();
            await loadReviews();
            await setupReviewForm();
        }

        init();
    </script>
</body>
</html>
