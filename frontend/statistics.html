<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>StayHome — Статистика объявления</title>
</head>
<body>
    <div class="utility-bar">
        <select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <nav class="site-nav">
        <a href="index.html" class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 10V19C5 19.5523 5.44772 20 6 20H9V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V20H18C18.5523 20 19 19.5523 19 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            StayHome
        </a>
        <div class="links">
            <a href="my-listings.html" data-i18n="back_to_my_listings">← Назад к моим объявлениям</a>
            <a href="listing-create.html" data-i18n="nav_create">Создать объявление</a>
            <a href="my-bookings.html" data-i18n="nav_my_bookings">Мои брони</a>
            <a href="favorites.html" data-i18n="nav_favorites">Избранное</a>
            <a href="profile.html" data-i18n="nav_profile">Профиль</a>
        </div>
    </nav>

    <div class="page">
        <h1 data-i18n="statistics_title">Статистика</h1>

        <div id="statsContainer" data-i18n="loading">Загрузка...</div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const listingId = params.get('listing_id');

        async function loadStatistics() {
            const container = document.getElementById('statsContainer');

            if (!listingId) {
                container.textContent = t('listing_not_specified');
                return;
            }

            try {
                const stats = await apiGet(`/statistics/listing/${listingId}/`);
                container.innerHTML = `
                    <p>${t('views_label')}: ${stats.view_count}</p>
                    <p>${t('booking_count_label')} ${stats.booking_count}</p>
                    <p>${t('revenue_label')}: ${stats.total_revenue} €</p>
                    <p>${t('avg_rating_stat_label')}: ${stats.average_rating ?? t('no_reviews')}</p>
                    <p>${t('reviews_count_label')}: ${stats.reviews_count}</p>
                `;
            } catch (err) {
                container.textContent = t('statistics_unavailable');
            }
        }

        loadStatistics();
    </script>
</body>
</html>
