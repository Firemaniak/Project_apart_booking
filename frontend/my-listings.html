<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>StayHome — Мои объявления</title>
</head>
<body>
    <div class="utility-bar">
        <select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <nav class="site-nav">
        <a href="index.html" class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 10V19C5 19.5523 5.44772 20 6 20H9V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V20H18C18.5523 20 19 19.5523 19 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            StayHome
        </a>
        <div class="links">
            <a href="index.html" data-i18n="back_to_catalog">← Назад к каталогу</a>
            <a href="listing-create.html" data-i18n="nav_create">Создать объявление</a>
            <a href="my-listings.html" data-i18n="nav_my_listings">Мои объявления</a>
            <a href="my-bookings.html" data-i18n="nav_my_bookings">Мои брони</a>
            <a href="favorites.html" data-i18n="nav_favorites">Избранное</a>
            <a href="profile.html" data-i18n="nav_profile">Профиль</a>
        </div>
    </nav>

    <div class="page">
        <h1 data-i18n="my_listings_title">Мои объявления</h1>

        <p id="authWarning" style="display: none; color: red;">
            <span data-i18n="need_login_prefix">Нужно</span> <a href="login.html" data-i18n="login_link">войти</a>, <span data-i18n="need_login_my_listings_suffix">чтобы увидеть свои объявления.</span>
        </p>

        <div id="listingsContainer"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        if (!isLoggedIn()) {
            document.getElementById('authWarning').style.display = 'block';
        } else {
            loadMyListings();
        }

        async function loadMyListings() {
            const container = document.getElementById('listingsContainer');
            try {
                const listings = await apiGet('/listings/my/');
                if (listings.length === 0) {
                    container.textContent = t('my_listings_empty');
                    return;
                }
                container.innerHTML = listings.map(function (listing) {
                    const photoUrl = listing.photos && listing.photos.length > 0
                        ? listing.photos[0].image
                        : null;
                    return `
                        <div class="panel">
                            ${photoUrl ? `<img src="${photoUrl}" width="150">` : ''}
                            <h3>${listing.apartment_name} ${listing.is_active ? '' : `<span class="muted">(${t('hidden_label')})</span>`}</h3>
                            <p>${listing.country}, ${listing.address}</p>
                            <p><strong>${listing.price_per_night} €</strong> ${t('per_night')}</p>
                            <a href="listing-detail.html?id=${listing.id}">${t('view_btn')}</a> |
                            <a href="listing-edit.html?id=${listing.id}">${t('edit_btn')}</a> |
                            <a href="statistics.html?listing_id=${listing.id}">${t('statistics_btn')}</a>
                            <button type="button" class="secondary" onclick="toggleActive('${listing.id}')">
                                ${listing.is_active ? t('hide_btn') : t('show_btn')}
                            </button>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.textContent = t('my_listings_load_error');
            }
        }

        async function toggleActive(listingId) {
            try {
                await apiPatch(`/listings/${listingId}/toggle-active/`, {});
                await loadMyListings();
            } catch (err) {
                alert(t('toggle_active_error') + ': ' + JSON.stringify(err.data));
            }
        }
    </script>
</body>
</html>
