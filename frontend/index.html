<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Каталог объявлений</title>
</head>
<body>
    <nav class="site-nav">
        <a href="index.html" class="brand">Nestwell</a>
        <div class="links">
            <a href="login.html" id="navLogin">Войти</a>
            <a href="register.html" id="navRegister">Регистрация</a>
            <a href="listing-create.html">Создать объявление</a>
            <a href="my-listings.html">Мои объявления</a>
            <a href="my-bookings.html">Мои брони</a>
            <a href="favorites.html">Избранное</a>
            <a href="profile.html">Профиль</a>
            <button id="logoutBtn" style="display: none;">Выйти</button>
        </div>
    </nav>

    <div class="page">
        <h1>Все объявления</h1>

        <form id="filterForm" class="form-grid" style="max-width: none; margin-bottom: 1.5rem;">
            <div>
                <label>Поиск по названию/описанию</label>
                <input type="text" id="searchInput" placeholder="Например: cozy loft">
            </div>
            <div>
                <label>Сортировка</label>
                <select id="orderingSelect">
                    <option value="">По умолчанию</option>
                    <option value="popular_views">По популярности (просмотры)</option>
                    <option value="popular_reviews">По популярности (отзывы)</option>
                </select>
            </div>
            <div>
                <label>Цена от (€)</label>
                <input type="number" id="minPriceInput" min="0" step="0.01">
            </div>
            <div>
                <label>Цена до (€)</label>
                <input type="number" id="maxPriceInput" min="0" step="0.01">
            </div>
            <div class="full">
                <button type="submit">Применить</button>
                <button type="button" class="secondary" id="resetFiltersBtn">Сбросить</button>
            </div>
        </form>

        <div id="listingsContainer">Загрузка...</div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const listingsContainer = document.getElementById('listingsContainer');
        const logoutBtn = document.getElementById('logoutBtn');
        let favoriteIds = new Map();
        let currentUserId = null;

        if (isLoggedIn()) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navRegister').style.display = 'none';
            logoutBtn.style.display = 'inline-block';
        }

        logoutBtn.addEventListener('click', function () {
            clearTokens();
            window.location.reload();
        });

        function buildQuery() {
            const params = new URLSearchParams();

            const search = document.getElementById('searchInput').value.trim();
            if (search) params.set('search', search);

            const ordering = document.getElementById('orderingSelect').value;
            if (ordering) params.set('ordering', ordering);

            const minPrice = document.getElementById('minPriceInput').value;
            if (minPrice) params.set('min_price', minPrice);

            const maxPrice = document.getElementById('maxPriceInput').value;
            if (maxPrice) params.set('max_price', maxPrice);

            const query = params.toString();
            return query ? `?${query}` : '';
        }

        async function loadFavoriteIds() {
            try {
                const favorites = await apiGet('/listings/favorites/');
                const map = new Map();
                favorites.forEach(function (fav) {
                    map.set(fav.listing, fav.id);
                });
                return map;
            } catch (err) {
                return new Map();
            }
        }

        async function loadListings() {
            listingsContainer.textContent = 'Загрузка...';
            try {
                const listings = await apiGet(`/listings/${buildQuery()}`);
                if (isLoggedIn()) {
                    favoriteIds = await loadFavoriteIds();
                    const profile = await apiGet('/users/me/');
                    currentUserId = profile.id;
                }
                renderListings(listings);
            } catch (err) {
                listingsContainer.textContent = 'Не удалось загрузить объявления.';
            }
        }

        function renderListings(listings) {
            if (listings.length === 0) {
                listingsContainer.innerHTML = '<p class="empty-state">Ничего не найдено.</p>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'listing-grid';

            listings.forEach(function (listing) {
                const photoUrl = listing.photos && listing.photos.length > 0
                    ? listing.photos[0].image
                    : null;

                const isFavorite = favoriteIds.has(listing.id);
                const isOwnListing = currentUserId === listing.owner;

                let actionHtml;
                if (isOwnListing) {
                    actionHtml = '<span class="muted">Ваше объявление</span>';
                } else if (isLoggedIn()) {
                    actionHtml = `<button type="button" class="secondary" onclick="toggleFavorite('${listing.id}', this)">${isFavorite ? '★ В избранном' : '☆ В избранное'}</button>`;
                } else {
                    actionHtml = '';
                }

                const card = document.createElement('div');
                card.className = 'listing-card';
                card.innerHTML = `
                    ${photoUrl ? `<img src="${photoUrl}" alt="${listing.apartment_name}">` : ''}
                    <div class="body">
                        <h3>${listing.apartment_name}</h3>
                        <p class="location">${listing.country}, ${listing.address}</p>
                        <p class="location">До ${listing.max_guests} гостей</p>
                        <span class="price-tag">${listing.price_per_night} € / сутки</span>
                        <div class="actions">
                            <a href="listing-detail.html?id=${listing.id}">Подробнее →</a>
                            ${actionHtml}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            listingsContainer.innerHTML = '';
            listingsContainer.appendChild(grid);
        }

        async function toggleFavorite(listingId, button) {
            try {
                if (favoriteIds.has(listingId)) {
                    const favId = favoriteIds.get(listingId);
                    await apiDelete(`/listings/favorites/${favId}/`);
                    favoriteIds.delete(listingId);
                    button.textContent = '☆ В избранное';
                } else {
                    const favorite = await apiPost('/listings/favorites/', { listing: listingId });
                    favoriteIds.set(listingId, favorite.id);
                    button.textContent = '★ В избранном';
                }
            } catch (err) {
                alert('Не удалось изменить избранное: ' + JSON.stringify(err.data));
            }
        }

        document.getElementById('filterForm').addEventListener('submit', function (event) {
            event.preventDefault();
            loadListings();
        });

        document.getElementById('resetFiltersBtn').addEventListener('click', function () {
            document.getElementById('filterForm').reset();
            loadListings();
        });

        loadListings();
    </script>
</body>
</html>
