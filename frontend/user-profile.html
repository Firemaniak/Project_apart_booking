<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>StayHome — Профиль пользователя</title>
</head>
<body>
    <div class="utility-bar">
        <select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <nav class="site-nav">
        <a href="index.html" class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 10V19C5 19.5523 5.44772 20 6 20H9V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V20H18C18.5523 20 19 19.5523 19 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            StayHome
        </a>
        <div class="links">
            <a href="index.html" data-i18n="back_to_catalog">← Назад к каталогу</a>
            <a href="listing-create.html" data-i18n="nav_create">Создать объявление</a>
            <a href="my-listings.html" data-i18n="nav_my_listings">Мои объявления</a>
            <a href="my-bookings.html" data-i18n="nav_my_bookings">Мои брони</a>
            <a href="favorites.html" data-i18n="nav_favorites">Избранное</a>
            <a href="profile.html" data-i18n="nav_profile">Профиль</a>
        </div>
    </nav>

    <div class="page">
        <div id="userContainer" data-i18n="loading">Загрузка...</div>

        <h2 data-i18n="host_stats_title">Статистика как хозяин</h2>
        <div id="statsContainer"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        async function loadUser() {
            const container = document.getElementById('userContainer');
            try {
                const user = await apiGet(`/users/${userId}/`);
                container.innerHTML = `
                    <h1>${user.username}</h1>
                    ${user.first_name || user.last_name ? `<p>${user.first_name} ${user.last_name}</p>` : ''}
                    ${user.avatar ? `<img src="${user.avatar}" width="150">` : ''}
                    <p>${t('member_since')} ${new Date(user.date_joined).toLocaleDateString()}</p>
                `;
            } catch (err) {
                container.textContent = t('user_not_found');
            }
        }

        async function loadStats() {
            const container = document.getElementById('statsContainer');
            try {
                const stats = await apiGet(`/statistics/user/${userId}/`);
                container.innerHTML = `
                    <p>${t('listing_count_label')} ${stats.listing_count}</p>
                    <p>${t('booking_count_label')} ${stats.booking_count}</p>
                    <p>${t('avg_rating_stat_label')}: ${stats.stars_count ?? t('no_reviews')}</p>
                `;
            } catch (err) {
                container.textContent = t('stats_unavailable');
            }
        }

        loadUser();
        loadStats();
    </script>
</body>
</html>
