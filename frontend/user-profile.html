<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Профиль пользователя</title>
</head>
<body>
    <p><a href="index.html">← Назад к каталогу</a></p>
    <div id="userContainer">Загрузка...</div>

    <h2>Статистика как хозяин</h2>
    <div id="statsContainer"></div>

    <script src="js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        async function loadUser() {
            const container = document.getElementById('userContainer');
            try {
                const user = await apiGet(`/users/${userId}/`);
                container.innerHTML = `
                    <h1>${user.username}</h1>
                    ${user.first_name || user.last_name ? `<p>${user.first_name} ${user.last_name}</p>` : ''}
                    ${user.avatar ? `<img src="${user.avatar}" width="150">` : ''}
                    <p>На платформе с ${new Date(user.date_joined).toLocaleDateString()}</p>
                `;
            } catch (err) {
                container.textContent = 'Пользователь не найден.';
            }
        }

        async function loadStats() {
            const container = document.getElementById('statsContainer');
            try {
                const stats = await apiGet(`/statistics/user/${userId}/`);
                container.innerHTML = `
                    <p>Объявлений: ${stats.listing_count}</p>
                    <p>Броней: ${stats.booking_count}</p>
                    <p>Средний рейтинг: ${stats.stars_count ?? 'нет отзывов'}</p>
                `;
            } catch (err) {
                container.textContent = 'Статистика недоступна.';
            }
        }

        loadUser();
        loadStats();
    </script>
</body>
</html>
