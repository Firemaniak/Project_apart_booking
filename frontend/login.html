<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Вход</title>
</head>
<body>
    <div style="text-align: right; padding: 0.5rem 1rem;">
        <select id="languageSelect" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <h1 data-i18n="login_title">Вход в аккаунт</h1>

    <form id="loginForm">
        <div>
            <label data-i18n="email_label">Email:</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label data-i18n="password_label">Пароль:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" data-i18n="login_btn">Войти</button>
    </form>

    <p id="errorMessage" style="color: red;"></p>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/users/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                if (!response.ok) {
                    throw new Error(t('login_error'));
                }

                const data = await response.json();
                setTokens(data.access, data.refresh);

                window.location.href = 'index.html';

            } catch (err) {
                errorMessage.textContent = err.message;
            }
        });
    </script>
</body>
</html>
