<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>StayHome — Избранное</title>
</head>
<body>
    <div class="utility-bar">
        <select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <nav class="site-nav">
        <a href="index.html" class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 10V19C5 19.5523 5.44772 20 6 20H9V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V20H18C18.5523 20 19 19.5523 19 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            StayHome
        </a>
        <div class="links">
            <a href="index.html" data-i18n="back_to_catalog">← Назад к каталогу</a>
            <a href="listing-create.html" data-i18n="nav_create">Создать объявление</a>
            <a href="my-listings.html" data-i18n="nav_my_listings">Мои объявления</a>
            <a href="my-bookings.html" data-i18n="nav_my_bookings">Мои брони</a>
            <a href="favorites.html" data-i18n="nav_favorites">Избранное</a>
            <a href="profile.html" data-i18n="nav_profile">Профиль</a>
        </div>
    </nav>

    <div class="page">
        <h1 data-i18n="favorites_title">Избранное</h1>

        <p id="authWarning" style="display: none; color: red;">
            <span data-i18n="need_login_prefix">Нужно</span> <a href="login.html" data-i18n="login_link">войти</a>, <span data-i18n="need_login_favorites_suffix">чтобы увидеть избранное.</span>
        </p>

        <div id="favoritesContainer"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        if (!isLoggedIn()) {
            document.getElementById('authWarning').style.display = 'block';
        } else {
            loadFavorites();
        }

        async function loadFavorites() {
            const container = document.getElementById('favoritesContainer');
            try {
                const favorites = await apiGet('/listings/favorites/');

                if (favorites.length === 0) {
                    container.innerHTML = `<p class="empty-state">${t('favorites_empty')}</p>`;
                    return;
                }

                const listings = await Promise.all(
                    favorites.map(async function (fav) {
                        const listing = await apiGet(`/listings/${fav.listing}/`);
                        return { favoriteId: fav.id, listing };
                    })
                );

                const grid = document.createElement('div');
                grid.className = 'listing-grid';

                listings.forEach(function ({ favoriteId, listing }) {
                    const photoUrl = listing.photos && listing.photos.length > 0
                        ? listing.photos[0].image
                        : null;

                    const card = document.createElement('div');
                    card.className = 'listing-card';
                    card.innerHTML = `
                        ${photoUrl ? `<img src="${photoUrl}" alt="${listing.apartment_name}">` : ''}
                        <div class="body">
                            <h3>${listing.apartment_name}</h3>
                            <p class="location">${listing.country}, ${listing.address}</p>
                            <span class="price-tag">${listing.price_per_night} € ${t('per_night')}</span>
                            <div class="actions">
                                <a href="listing-detail.html?id=${listing.id}">${t('more_details')}</a>
                                <button type="button" class="secondary" onclick="removeFavorite('${favoriteId}')">${t('remove_btn')}</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                container.innerHTML = '';
                container.appendChild(grid);
            } catch (err) {
                container.textContent = t('favorites_load_error');
            }
        }

        async function removeFavorite(favoriteId) {
            try {
                await apiDelete(`/listings/favorites/${favoriteId}/`);
                await loadFavorites();
            } catch (err) {
                alert(t('favorites_remove_error') + ': ' + JSON.stringify(err.data));
            }
        }
    </script>
</body>
</html>
