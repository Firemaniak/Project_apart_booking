<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <title>StayHome — Редактировать объявление</title>
</head>
<body>
    <div class="utility-bar">
        <select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <nav class="site-nav">
        <a href="index.html" class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 10V19C5 19.5523 5.44772 20 6 20H9V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V20H18C18.5523 20 19 19.5523 19 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            StayHome
        </a>
        <div class="links">
            <a href="index.html" data-i18n="back_to_catalog">← Назад к каталогу</a>
            <a href="listing-create.html" data-i18n="nav_create">Создать объявление</a>
            <a href="my-listings.html" data-i18n="nav_my_listings">Мои объявления</a>
            <a href="my-bookings.html" data-i18n="nav_my_bookings">Мои брони</a>
            <a href="favorites.html" data-i18n="nav_favorites">Избранное</a>
            <a href="profile.html" data-i18n="nav_profile">Профиль</a>
        </div>
    </nav>

    <div class="page">
        <h1 data-i18n="edit_listing_title">Редактировать объявление</h1>

        <form id="listingForm">
            <div><label data-i18n="name_label">Название:</label><input type="text" id="apartmentName" required></div>
            <div><label data-i18n="description_label">Описание:</label><textarea id="description"></textarea></div>
            <div><label data-i18n="country_label">Страна:</label>
                <select id="country" required>
                    <option value="DE" data-i18n="germany_option">Германия</option>
                </select>
            </div>

            <div>
                <label data-i18n="address_label">Адрес:</label>
                <input type="text" id="address" required>
                <button type="button" class="secondary" id="findOnMapBtn" data-i18n="find_on_map_btn">Найти на карте</button>
            </div>

            <div>
                <label data-i18n="map_location_edit_label">Местоположение на карте (кликните, чтобы изменить точку)</label>
                <div id="mapPicker" style="height: 300px; border: 1px solid var(--line); border-radius: var(--radius);"></div>
                <input type="hidden" id="latitude">
                <input type="hidden" id="longitude">
            </div>

            <div><label data-i18n="property_type_label">Тип жилья:</label>
                <select id="propertyType">
                    <option value="apartment" data-i18n="type_apartment">Квартира</option>
                    <option value="house" data-i18n="type_house">Дом</option>
                    <option value="studio" data-i18n="type_studio">Студия</option>
                </select>
            </div>

            <div id="floorField"><label data-i18n="floor_label">Этаж:</label><input type="number" id="floor" min="1"></div>
            <div id="floorsCountField" style="display: none;"><label data-i18n="floors_count_label">Количество этажей:</label><input type="number" id="floorsCount" min="1"></div>

            <div id="roomsSection">
                <div><label data-i18n="room_count_label">Количество комнат:</label><input type="number" id="roomCount" min="1" required></div>
                <div><label data-i18n="shower_count_label">Количество ванных:</label><input type="number" id="showerCount" min="1" required></div>
                <div><label data-i18n="toilets_count_label">Количество туалетов:</label><input type="number" id="toiletsCount" min="1" required></div>
            </div>

            <div><label data-i18n="max_guests_label">Макс. гостей:</label><input type="number" id="maxGuests" min="1" required></div>
            <div><label data-i18n="input_type_label">Как попасть внутрь:</label>
                <select id="inputType">
                    <option value="key" data-i18n="input_key">Ключ</option>
                    <option value="pin_kode" data-i18n="input_pin">Пин-код</option>
                    <option value="card" data-i18n="input_card">Карта</option>
                </select>
            </div>
            <div><label data-i18n="price_per_night_label">Цена за сутки (€):</label><input type="number" id="pricePerNight" step="0.01" min="0.01" required></div>

            <div><label><input type="checkbox" id="parking"> <span data-i18n="parking_label">Парковка</span></label></div>
            <div><label><input type="checkbox" id="wifi"> Wi-Fi</label></div>
            <div><label><input type="checkbox" id="canSmoke"> <span data-i18n="smoke_label">Можно курить</span></label></div>
            <div><label><input type="checkbox" id="canPets"> <span data-i18n="pets_label">Можно с питомцами</span></label></div>
            <div><label><input type="checkbox" id="indoorFireplace"> <span data-i18n="fireplace_label">Камин</span></label></div>
            <div><label><input type="checkbox" id="airConditioner"> <span data-i18n="ac_label">Кондиционер</span></label></div>
            <div><label><input type="checkbox" id="elevator"> <span data-i18n="elevator_label">Лифт</span></label></div>
            <div><label><input type="checkbox" id="facilities"> <span data-i18n="disability_label">Доступно для людей с инвалидностью</span></label></div>

            <button type="submit" data-i18n="save_changes_btn">Сохранить изменения</button>
        </form>

        <h2 data-i18n="photos_title">Фото</h2>
        <div id="photosContainer"></div>

        <h3 data-i18n="add_new_photo_title">Добавить новое фото</h3>
        <input type="file" id="photoInput" accept="image/*" multiple>
        <button id="uploadPhotosBtn" type="button" data-i18n="upload_btn">Загрузить</button>
        <p id="photoMessage"></p>

        <p id="message"></p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const listingId = params.get('id');

        let selectedMarker = null;

        const pickerMap = L.map('mapPicker').setView([51.1657, 10.4515], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
        }).addTo(pickerMap);

        function placeMarker(lat, lng) {
            if (selectedMarker) {
                pickerMap.removeLayer(selectedMarker);
            }
            selectedMarker = L.marker([lat, lng]).addTo(pickerMap);
            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
        }

        async function fillAddressFromCoordinates(lat, lng) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`,
                    { headers: { 'Accept-Language': 'de' } }
                );
                const data = await response.json();

                if (data.address) {
                    const addr = data.address;
                    const street = [addr.road, addr.house_number].filter(Boolean).join(' ');
                    const fullAddress = [street, addr.postcode, addr.city || addr.town].filter(Boolean).join(', ');
                    document.getElementById('address').value = fullAddress || data.display_name;
                }
            } catch (err) {
                console.error('Не удалось определить адрес:', err);
            }
        }

        pickerMap.on('click', async function (e) {
            const { lat, lng } = e.latlng;
            placeMarker(lat, lng);
            await fillAddressFromCoordinates(lat, lng);
        });

        document.getElementById('findOnMapBtn').addEventListener('click', async function () {
            const address = document.getElementById('address').value.trim();
            if (!address) {
                alert(t('enter_address_first'));
                return;
            }

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=de&limit=1`
                );
                const results = await response.json();

                if (results.length === 0) {
                    alert(t('address_not_found'));
                    return;
                }

                const lat = parseFloat(results[0].lat);
                const lng = parseFloat(results[0].lon);
                pickerMap.setView([lat, lng], 16);
                placeMarker(lat, lng);
            } catch (err) {
                alert(t('address_search_error'));
            }
        });

        function togglePropertyFields() {
            const type = document.getElementById('propertyType').value;
            const floorField = document.getElementById('floorField');
            const floorsCountField = document.getElementById('floorsCountField');
            const roomsSection = document.getElementById('roomsSection');

            if (type === 'house') {
                floorField.style.display = 'none';
                floorsCountField.style.display = 'block';
                document.getElementById('floor').required = false;
                document.getElementById('floorsCount').required = true;
            } else {
                floorField.style.display = 'block';
                floorsCountField.style.display = 'none';
                document.getElementById('floor').required = true;
                document.getElementById('floorsCount').required = false;
            }

            if (type === 'studio') {
                roomsSection.style.display = 'none';
                document.getElementById('roomCount').required = false;
                document.getElementById('showerCount').required = false;
                document.getElementById('toiletsCount').required = false;
            } else {
                roomsSection.style.display = 'block';
                document.getElementById('roomCount').required = true;
                document.getElementById('showerCount').required = true;
                document.getElementById('toiletsCount').required = true;
            }
        }

        document.getElementById('propertyType').addEventListener('change', togglePropertyFields);

        async function loadListing() {
            try {
                const listing = await apiGet(`/listings/${listingId}/`);
                fillForm(listing);
                renderPhotos(listing);
            } catch (err) {
                document.getElementById('message').textContent = t('listing_load_error');
            }
        }

        function fillForm(listing) {
            document.getElementById('apartmentName').value = listing.apartment_name;
            document.getElementById('description').value = listing.description || '';
            document.getElementById('country').value = listing.country;
            document.getElementById('address').value = listing.address;
            document.getElementById('floor').value = listing.floor || '';
            document.getElementById('floorsCount').value = listing.floors_count || '';
            document.getElementById('propertyType').value = listing.property_type;
            document.getElementById('roomCount').value = listing.room_count;
            document.getElementById('showerCount').value = listing.shower_count;
            document.getElementById('toiletsCount').value = listing.toilets_count;
            document.getElementById('maxGuests').value = listing.max_guests;
            document.getElementById('inputType').value = listing.input_type;
            document.getElementById('pricePerNight').value = listing.price_per_night;
            document.getElementById('parking').checked = listing.parking;
            document.getElementById('wifi').checked = listing.wifi;
            document.getElementById('canSmoke').checked = listing.can_smoke;
            document.getElementById('canPets').checked = listing.can_pets;
            document.getElementById('indoorFireplace').checked = listing.indoor_fireplace;
            document.getElementById('airConditioner').checked = listing.air_conditioner;
            document.getElementById('elevator').checked = listing.elevator;
            document.getElementById('facilities').checked = listing.facilities_for_guests_with_disabilities;

            togglePropertyFields();

            if (listing.latitude && listing.longitude) {
                const lat = parseFloat(listing.latitude);
                const lng = parseFloat(listing.longitude);
                pickerMap.setView([lat, lng], 14);
                placeMarker(lat, lng);
            }
        }

        function renderPhotos(listing) {
            const container = document.getElementById('photosContainer');
            const photos = listing.photos || [];

            if (photos.length === 0) {
                container.textContent = t('no_photos_yet');
                return;
            }

            container.innerHTML = photos.map(function (photo) {
                return `
                    <div style="display: inline-block; margin-right: 10px; text-align: center;">
                        <img src="${photo.image}" width="150"><br>
                        <button type="button" onclick="deletePhoto('${photo.id}')">${t('delete_photo_btn')}</button>
                    </div>
                `;
            }).join('');
        }

        async function deletePhoto(photoId) {
            if (!confirm(t('delete_photo_confirm'))) return;
            try {
                await apiDelete(`/listings/photos/${photoId}/delete/`);
                await loadListing();
            } catch (err) {
                alert(t('delete_photo_error') + ': ' + JSON.stringify(err.data));
            }
        }

        document.getElementById('uploadPhotosBtn').addEventListener('click', async function () {
            const files = document.getElementById('photoInput').files;
            const photoMessage = document.getElementById('photoMessage');

            if (files.length === 0) {
                photoMessage.textContent = t('select_file_prompt');
                return;
            }

            let uploaded = 0;
            for (const file of files) {
                const formData = new FormData();
                formData.append('image', file);
                formData.append('listing', listingId);

                try {
                    await apiPost('/listings/photos/create/', formData);
                    uploaded++;
                } catch (err) {
                    console.error('Ошибка загрузки фото:', err);
                }
            }

            photoMessage.style.color = 'green';
            photoMessage.textContent = `${t('photos_uploaded')}: ${uploaded} / ${files.length}`;
            document.getElementById('photoInput').value = '';
            await loadListing();
        });

        document.getElementById('listingForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const message = document.getElementById('message');

            const payload = {
                apartment_name: document.getElementById('apartmentName').value,
                description: document.getElementById('description').value,
                country: document.getElementById('country').value,
                address: document.getElementById('address').value,
                latitude: document.getElementById('latitude').value || null,
                longitude: document.getElementById('longitude').value || null,
                floor: document.getElementById('floor').value ? parseInt(document.getElementById('floor').value) : null,
                floors_count: document.getElementById('floorsCount').value ? parseInt(document.getElementById('floorsCount').value) : null,
                property_type: document.getElementById('propertyType').value,
                room_count: parseInt(document.getElementById('roomCount').value) || 1,
                shower_count: parseInt(document.getElementById('showerCount').value) || 1,
                toilets_count: parseInt(document.getElementById('toiletsCount').value) || 1,
                max_guests: parseInt(document.getElementById('maxGuests').value),
                input_type: document.getElementById('inputType').value,
                price_per_night: document.getElementById('pricePerNight').value,
                parking: document.getElementById('parking').checked,
                wifi: document.getElementById('wifi').checked,
                can_smoke: document.getElementById('canSmoke').checked,
                can_pets: document.getElementById('canPets').checked,
                indoor_fireplace: document.getElementById('indoorFireplace').checked,
                air_conditioner: document.getElementById('airConditioner').checked,
                elevator: document.getElementById('elevator').checked,
                facilities_for_guests_with_disabilities: document.getElementById('facilities').checked,
            };

            try {
                await apiPatch(`/listings/${listingId}/`, payload);
                message.style.color = 'green';
                message.textContent = t('changes_saved');
            } catch (err) {
                message.style.color = 'red';
                message.textContent = JSON.stringify(err.data);
            }
        });

        loadListing();
    </script>
</body>
</html>
