<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Регистрация</title>
</head>
<body>
    <div style="text-align: right; padding: 0.5rem 1rem;">
        <select id="languageSelect" onchange="setLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="uk">UA</option>
        </select>
    </div>

    <h1 data-i18n="register_title">Регистрация</h1>

    <form id="registerForm">
        <div>
            <label data-i18n="username_label">Имя пользователя:</label>
            <input type="text" id="username" required>
        </div>
        <div>
            <label data-i18n="email_label">Email:</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label data-i18n="password_label">Пароль:</label>
            <input type="password" id="password" required>
        </div>
        <div>
            <label data-i18n="password_confirm_label">Повторите пароль:</label>
            <input type="password" id="passwordConfirm" required>
        </div>
        <div>
            <label data-i18n="birth_date_label">Дата рождения:</label>
            <input type="date" id="birthDate">
        </div>
        <div>
            <label data-i18n="phone_label">Телефон:</label>
            <input type="tel" id="phone">
        </div>
        <button type="submit" data-i18n="register_btn">Зарегистрироваться</button>
    </form>

    <p id="errorMessage" style="color: red;"></p>
    <p><a href="login.html" data-i18n="have_account">Уже есть аккаунт? Войти</a></p>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            errorMessage.textContent = '';

            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                password_confirm: document.getElementById('passwordConfirm').value,
            };

            const birthDate = document.getElementById('birthDate').value;
            if (birthDate) payload.birth_date = birthDate;

            const phone = document.getElementById('phone').value;
            if (phone) payload.phone = phone;

            try {
                await apiPost('/users/register/', payload);
                alert(t('register_success'));
                window.location.href = 'login.html';
            } catch (err) {
                errorMessage.textContent = formatErrors(err.data);
            }
        });

        function formatErrors(data) {
            if (!data) return t('generic_error');
            return Object.entries(data)
                .map(([field, messages]) => `${field}: ${Array.isArray(messages) ? messages.join(', ') : messages}`)
                .join(' | ');
        }
    </script>
</body>
</html>
